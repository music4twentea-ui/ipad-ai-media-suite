name: Build All 3 iPad Apps (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ipad-ipa-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build-three-ipad-ipas:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Latest Installed Xcode on Runner
        shell: bash
        run: |
          if ls -d /Applications/Xcode_16*.app >/dev/null 2>&1; then
            LATEST_XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -n 1)
            echo "Selecting $LATEST_XCODE"
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Organize & Sanitize Sources, Entry Points, project.yml & Info.plist Files
        shell: bash
        run: |
          set -e
          rm -rf Sources Config iPadAIMediaSuite.xcodeproj build_ipas
          mkdir -p Sources/ProMediaPlayerEnhanced
          mkdir -p Sources/OfflineAIVideoStudio
          mkdir -p Sources/CoreMLPackageConverter
          mkdir -p Config
          mkdir -p build_ipas

          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Extracting $z..."
              unzip -o "$z"
            fi
          done

          if [ -f "promediaplayerenhanced_5.swift" ]; then
            cp "promediaplayerenhanced_5.swift" Sources/ProMediaPlayerEnhanced/ContentView.swift
          elif [ -f "ProMediaPlayerEnhanced.swift" ]; then
            cp "ProMediaPlayerEnhanced.swift" Sources/ProMediaPlayerEnhanced/ContentView.swift
          fi

          if [ -f "OfflineAIVideoStudioApp.swift" ]; then
            cp "OfflineAIVideoStudioApp.swift" Sources/OfflineAIVideoStudio/ContentView.swift
          fi

          if [ -f "CoreMLPackageConverterApp.swift" ]; then
            cp "CoreMLPackageConverterApp.swift" Sources/CoreMLPackageConverter/ContentView.swift
          fi

          # Run automatic Swift 6 / Xcode 16 concurrency & Sendable sanitizer on all target sources
          cat << 'PYEOF' > sanitize_runner.py
          import re
          
          def sanitize_swift_source(path):
              with open(path, "r", encoding="utf-8") as f:
                  text = f.read()
          
              # 1. Ensure WeakSendableBox is defined
              if "WeakSendableBox" not in text:
                  text = text.replace(
                      "private struct UncheckedSendableBox<Value>: @unchecked Sendable {\n    let value: Value\n}",
                      "private struct UncheckedSendableBox<Value>: @unchecked Sendable {\n    let value: Value\n}\n\nprivate struct WeakSendableBox<Value: AnyObject>: @unchecked Sendable {\n    weak var value: Value?\n}"
                  )
          
              # 2. Ensure AIEnhancerState has hasExternalModelLoaded & externalModelName
              if "public var hasExternalModelLoaded: Bool {" not in text and "public var snapshot: AIEnhancerSnapshot {" in text:
                  text = text.replace(
                      "    public var snapshot: AIEnhancerSnapshot {",
                      """    public var hasExternalModelLoaded: Bool {
                  get { loadedCustomModelName != nil || !loadedRoleModels.isEmpty }
                  set {
                      if !newValue {
                          loadedCustomModelName = nil
                          loadedRoleModels.removeAll()
                      } else if loadedCustomModelName == nil {
                          loadedCustomModelName = "Active CoreML Pipeline"
                      }
                  }
              }
              
              public var externalModelName: String? {
                  get { loadedCustomModelName }
                  set { loadedCustomModelName = newValue }
              }
              
              public var snapshot: AIEnhancerSnapshot {""",
                      1
                  )
          
              # 3. Ensure ContentView.init(appState:) does NOT call @MainActor AppSharedState() in a nonisolated default parameter
              text = text.replace(
                  "public init(appState: AppSharedState = AppSharedState()) {",
                  "public init(appState: AppSharedState) {"
              )
          
              # 4. Fix all nested `{ [weak self] ... in Task { @MainActor [weak self] in` patterns in promediaplayerenhanced_5.swift
              # Pattern A: SFSpeechRecognizer.requestAuthorization
              text = text.replace(
                  """        SFSpeechRecognizer.requestAuthorization { [weak self] authStatus in
                      Task { @MainActor [weak self] in
                          guard let self = self, self.isEnabled else { return }""",
                  """        let weakSelf = WeakSendableBox(value: self)
                  SFSpeechRecognizer.requestAuthorization { authStatus in
                      Task { @MainActor in
                          guard let self = weakSelf.value, self.isEnabled else { return }"""
              )
          
              # Pattern B: activeRecognizer.recognitionTask
              text = text.replace(
                  """            self.recognitionTask = activeRecognizer.recognitionTask(with: request) { [weak self] result, error in
                          Task { @MainActor [weak self] in
                              guard let self = self, self.isEnabled else { return }
                              if let result = result {""",
                  """            let weakSelf = WeakSendableBox(value: self)
                      self.recognitionTask = activeRecognizer.recognitionTask(with: request) { result, error in
                          let resBox = UncheckedSendableBox(value: result)
                          Task { @MainActor in
                              guard let self = weakSelf.value, self.isEnabled else { return }
                              if let result = resBox.value {"""
              )
          
              # Pattern C: DeviceOrientationObserver
              text = text.replace(
                  """        NotificationCenter.default.addObserver(
                      forName: UIDevice.orientationDidChangeNotification,
                      object: nil,
                      queue: .main
                  ) { [weak self] _ in
                      Task { @MainActor [weak self] in
                          guard let self = self else { return }""",
                  """        let weakSelf = WeakSendableBox(value: self)
                  NotificationCenter.default.addObserver(
                      forName: UIDevice.orientationDidChangeNotification,
                      object: nil,
                      queue: .main
                  ) { _ in
                      Task { @MainActor in
                          guard let self = weakSelf.value else { return }"""
              )
          
              # Pattern D: MPRemoteCommandCenter
              text = text.replace(
                  """    private func setupRemoteTransportCommands() {
                  let commandCenter = MPRemoteCommandCenter.shared()
                  commandCenter.playCommand.addTarget { [weak self] _ in
                      Task { @MainActor [weak self] in
                          guard let self = self, !self.isPlaying else { return }
                          self.togglePlayPause()
                      }
                      return .success
                  }
                  commandCenter.pauseCommand.addTarget { [weak self] _ in
                      Task { @MainActor [weak self] in
                          guard let self = self, self.isPlaying else { return }
                          self.togglePlayPause()
                      }
                      return .success
                  }
                  commandCenter.nextTrackCommand.addTarget { [weak self] _ in
                      Task { @MainActor [weak self] in self?.nextTrack() }
                      return .success
                  }
                  commandCenter.previousTrackCommand.addTarget { [weak self] _ in
                      Task { @MainActor [weak self] in self?.previousTrack() }
                      return .success
                  }
              }""",
                  """    private func setupRemoteTransportCommands() {
                  let commandCenter = MPRemoteCommandCenter.shared()
                  let weakSelf = WeakSendableBox(value: self)
                  commandCenter.playCommand.addTarget { _ in
                      Task { @MainActor in
                          guard let self = weakSelf.value, !self.isPlaying else { return }
                          self.togglePlayPause()
                      }
                      return .success
                  }
                  commandCenter.pauseCommand.addTarget { _ in
                      Task { @MainActor in
                          guard let self = weakSelf.value, self.isPlaying else { return }
                          self.togglePlayPause()
                      }
                      return .success
                  }
                  commandCenter.nextTrackCommand.addTarget { _ in
                      Task { @MainActor in weakSelf.value?.nextTrack() }
                      return .success
                  }
                  commandCenter.previousTrackCommand.addTarget { _ in
                      Task { @MainActor in weakSelf.value?.previousTrack() }
                      return .success
                  }
              }"""
              )
          
              # Pattern E: addPeriodicTimeObserver & AVPlayerItemDidPlayToEndTime
              text = text.replace(
                  """        let interval = CMTime(seconds: 0.1, preferredTimescale: 600)
                  timeObserverToken = newPlayer.addPeriodicTimeObserver(forInterval: interval, queue: .main) { [weak self] time in
                      Task { @MainActor [weak self] in
                          guard let self = self, !self.isScrubbing else { return }""",
                  """        let interval = CMTime(seconds: 0.1, preferredTimescale: 600)
                  let weakSelf = WeakSendableBox(value: self)
                  timeObserverToken = newPlayer.addPeriodicTimeObserver(forInterval: interval, queue: .main) { time in
                      Task { @MainActor in
                          guard let self = weakSelf.value, !self.isScrubbing else { return }"""
              )
          
              text = text.replace(
                  """        endObserverToken = NotificationCenter.default.addObserver(
                      forName: .AVPlayerItemDidPlayToEndTime,
                      object: item,
                      queue: .main
                  ) { [weak self] _ in
                      Task { @MainActor [weak self] in
                          self?.nextTrack()
                      }
                  }""",
                  """        endObserverToken = NotificationCenter.default.addObserver(
                      forName: .AVPlayerItemDidPlayToEndTime,
                      object: item,
                      queue: .main
                  ) { _ in
                      Task { @MainActor in
                          weakSelf.value?.nextTrack()
                      }
                  }"""
              )
          
              # Pattern F: generateThumbnailAsync
              text = text.replace(
                  """        Task.detached(priority: .userInitiated) { [weak self] in
                      do {
                          let (cgImage, _) = try await generatorBox.value.image(at: requestedCMTime)
                          let finalUIImage: UIImage
                          if snap.isEnabled {
                              let rawCI = CIImage(cgImage: cgImage)
                              let enhancedCI = AIEnhancementEngine.shared.applyEnhancement(to: rawCI, snapshot: snap, isOfflineExport: false)
                              if let outCG = AIEnhancementEngine.shared.ciContext.createCGImage(enhancedCI, from: rawCI.extent) {
                                  finalUIImage = UIImage(cgImage: outCG)
                              } else {
                                  finalUIImage = UIImage(cgImage: cgImage)
                              }
                          } else {
                              finalUIImage = UIImage(cgImage: cgImage)
                          }
                          
                          await MainActor.run { [weak self] in
                              guard let self = self else { return }""",
                  """        let weakSelf = WeakSendableBox(value: self)
                  Task.detached(priority: .userInitiated) {
                      do {
                          let (cgImage, _) = try await generatorBox.value.image(at: requestedCMTime)
                          let finalUIImage: UIImage
                          if snap.isEnabled {
                              let rawCI = CIImage(cgImage: cgImage)
                              let enhancedCI = AIEnhancementEngine.shared.applyEnhancement(to: rawCI, snapshot: snap, isOfflineExport: false)
                              if let outCG = AIEnhancementEngine.shared.ciContext.createCGImage(enhancedCI, from: rawCI.extent) {
                                  finalUIImage = UIImage(cgImage: outCG)
                              } else {
                                  finalUIImage = UIImage(cgImage: cgImage)
                              }
                          } else {
                              finalUIImage = UIImage(cgImage: cgImage)
                          }
                          let imgBox = UncheckedSendableBox(value: finalUIImage)
                          await MainActor.run {
                              guard let self = weakSelf.value else { return }
                              let finalUIImage = imgBox.value"""
              )
          
              # Pattern G: Wrap CIImage in UncheckedSendableBox inside extractBasePreviewFrame so CIImage never triggers non-Sendable capture across MainActor.run
              text = text.replace(
                  """            if let (cgImage, _) = try? await gen.image(at: cmTime) {
                          let ciImg = CIImage(cgImage: cgImage)
                          let detectedBoxes = AIEnhancementEngine.shared.detectFacesOnce(in: ciImg)
                          await MainActor.run {
                              if dur.isFinite && dur > 0 {
                                  self.previewDuration = dur
                              }
                              self.rawSampleCIImage = ciImg""",
                  """            if let (cgImage, _) = try? await gen.image(at: cmTime) {
                          let ciImg = CIImage(cgImage: cgImage)
                          let ciBox = UncheckedSendableBox(value: ciImg)
                          let detectedBoxes = AIEnhancementEngine.shared.detectFacesOnce(in: ciImg)
                          await MainActor.run {
                              if dur.isFinite && dur > 0 {
                                  self.previewDuration = dur
                              }
                              self.rawSampleCIImage = ciBox.value"""
              )
          
              text = text.replace(
                  """            if let (cgImage, _) = try? await gen.image(at: cmTime) {
                          let ciImg = CIImage(cgImage: cgImage)
                          let boxes = AIEnhancementEngine.shared.detectFacesOnce(in: ciImg)
                          await MainActor.run {
                              if dur.isFinite && dur > 0 {
                                  self.previewDuration = dur
                                  if self.previewTimestamp > dur {
                                      self.previewTimestamp = max(dur * 0.2, 0.5)
                                  }
                              }
                              self.rawSampleCIImage = ciImg""",
                  """            if let (cgImage, _) = try? await gen.image(at: cmTime) {
                          let ciImg = CIImage(cgImage: cgImage)
                          let ciBox = UncheckedSendableBox(value: ciImg)
                          let boxes = AIEnhancementEngine.shared.detectFacesOnce(in: ciImg)
                          await MainActor.run {
                              if dur.isFinite && dur > 0 {
                                  self.previewDuration = dur
                                  if self.previewTimestamp > dur {
                                      self.previewTimestamp = max(dur * 0.2, 0.5)
                                  }
                              }
                              self.rawSampleCIImage = ciBox.value"""
              )
          
              # Pattern H: Wrap UIImage thumbSnapshot in UncheckedSendableBox in OfflineAIVideoProcessor
              text = text.replace(
                  """                        let frameCountSnapshot = processedFrames
                                  let thumbSnapshot = previewThumbToPublish
                                  let shouldSaveProgress = (processedFrames % 120 == 0)
                                  
                                  await MainActor.run {
                                      guard let self = weakProcessorBox.value, !cancelToken.isCancelled else { return }
                                      if let idx = self.jobs.firstIndex(where: { $0.id == jobID }) {
                                          self.jobs[idx].progressState.progress = progressFraction
                                          self.jobs[idx].progressState.currentFrame = frameCountSnapshot
                                          self.jobs[idx].progressState.processingFPS = fps
                                          self.jobs[idx].progressState.elapsedTime = elapsed
                                          self.jobs[idx].progressState.remainingTime = remainingSec
                                          if let t = thumbSnapshot {""",
                  """                        let frameCountSnapshot = processedFrames
                                  let thumbBox = UncheckedSendableBox(value: previewThumbToPublish)
                                  let shouldSaveProgress = (processedFrames % 120 == 0)
                                  
                                  await MainActor.run {
                                      guard let self = weakProcessorBox.value, !cancelToken.isCancelled else { return }
                                      if let idx = self.jobs.firstIndex(where: { $0.id == jobID }) {
                                          self.jobs[idx].progressState.progress = progressFraction
                                          self.jobs[idx].progressState.currentFrame = frameCountSnapshot
                                          self.jobs[idx].progressState.processingFPS = fps
                                          self.jobs[idx].progressState.elapsedTime = elapsed
                                          self.jobs[idx].progressState.remainingTime = remainingSec
                                          if let t = thumbBox.value {"""
              )
          
              # Pattern I: Replace any remaining `.onChange(of: ...) { _ in`
              text = re.sub(r'(\.onChange\(of:\s*[^)]+\)\s*\{\s*)_\s+in\b', r'\1', text)
          
              with open(path, "w", encoding="utf-8") as f:
                  f.write(text)
              print(f"Sanitized {path}: Lines={len(text.splitlines())}, Braces={text.count('{')}/{text.count('}')}")
          import os
          for p in [
              "Sources/ProMediaPlayerEnhanced/ContentView.swift",
              "Sources/OfflineAIVideoStudio/ContentView.swift",
              "Sources/CoreMLPackageConverter/ContentView.swift"
          ]:
              if os.path.exists(p):
                  sanitize_swift_source(p)
          PYEOF
          python3 sanitize_runner.py

          if [ -f "Sources/ProMediaPlayerEnhanced/ContentView.swift" ]; then
            if ! grep -q "@main" Sources/ProMediaPlayerEnhanced/ContentView.swift; then
              cat << 'EOF' > Sources/ProMediaPlayerEnhanced/MyApp.swift
          import SwiftUI

          @main
          struct ProMediaPlayerEnhancedApp: App {
              @StateObject private var appState = AppSharedState()
              var body: some Scene {
                  WindowGroup {
                      ContentView(appState: appState)
                          .preferredColorScheme(.dark)
                          .onOpenURL { url in
                              appState.ingestExternalVideoURL(url)
                          }
                  }
              }
          }
          EOF
            fi
          fi

          if [ -f "Sources/OfflineAIVideoStudio/ContentView.swift" ]; then
            if ! grep -q "@main" Sources/OfflineAIVideoStudio/ContentView.swift; then
              cat << 'EOF' > Sources/OfflineAIVideoStudio/MyApp.swift
          import SwiftUI

          @main
          struct OfflineAIVideoStudioMainApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          EOF
            fi
          fi

          if [ -f "Sources/CoreMLPackageConverter/ContentView.swift" ]; then
            if ! grep -q "@main" Sources/CoreMLPackageConverter/ContentView.swift; then
              cat << 'EOF' > Sources/CoreMLPackageConverter/MyApp.swift
          import SwiftUI

          @main
          struct CoreMLPackageConverterMainApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                          .preferredColorScheme(.dark)
                  }
              }
          }
          EOF
            fi
          fi

          make_plist() {
            local plist_path="$1"
            local display_name="$2"
            local bundle_id="$3"
            cat << EOF > "${plist_path}"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>en</string>
              <key>CFBundleDisplayName</key>
              <string>${display_name}</string>
              <key>CFBundleExecutable</key>
              <string>\$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>${bundle_id}</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>\$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key>
                  <true/>
              </dict>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
                  <string>UIInterfaceOrientationPortraitUpsideDown</string>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UIBackgroundModes</key>
              <array>
                  <string>audio</string>
                  <string>fetch</string>
                  <string>processing</string>
              </array>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>Save AI-enhanced 4K videos directly to your Photos library.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>Import and save AI-enhanced videos to your Photos library.</string>
              <key>NSMicrophoneUsageDescription</key>
              <string>Used for live AI audio caption translation when enabled.</string>
              <key>NSSpeechRecognitionUsageDescription</key>
              <string>Used for on-device live AI speech-to-English captions.</string>
          </dict>
          </plist>
          EOF
          }

          make_plist "Config/ProMediaPlayerEnhanced-Info.plist" "Pro AI Player" "com.ai.ipadstudio.promediaplayer"
          make_plist "Config/OfflineAIVideoStudio-Info.plist" "AI Video Studio" "com.ai.ipadstudio.offlinestudio"
          make_plist "Config/CoreMLPackageConverter-Info.plist" "CoreML Converter" "com.ai.ipadstudio.coremlconverter"

          cat << 'EOF' > project.yml
          name: iPadAIMediaSuite
          options:
            bundleIdPrefix: com.ai.ipadstudio
            deploymentTarget:
              iOS: "17.0"
            xcodeVersion: "15.0"
            generateEmptyDirectories: true

          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: "17.0"
              TARGETED_DEVICE_FAMILY: "1,2"
              SUPPORTS_MACCATALYST: NO
              SWIFT_VERSION: "5.0"
              SWIFT_STRICT_CONCURRENCY: minimal
              CODE_SIGNING_ALLOWED: NO
              CODE_SIGNING_REQUIRED: NO
              CODE_SIGN_IDENTITY: ""
              AD_HOC_CODE_SIGNING_ALLOWED: NO
              DEVELOPMENT_TEAM: ""
              ASSETCATALOG_COMPILER_APPICON_NAME: ""
              ENABLE_BITCODE: NO

          targets:
            ProMediaPlayerEnhanced:
              type: application
              platform: iOS
              sources:
                - path: Sources/ProMediaPlayerEnhanced
              scheme: {}
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ai.ipadstudio.promediaplayer
                  PRODUCT_NAME: ProMediaPlayerEnhanced
                  INFOPLIST_FILE: Config/ProMediaPlayerEnhanced-Info.plist
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  AD_HOC_CODE_SIGNING_ALLOWED: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""

            OfflineAIVideoStudio:
              type: application
              platform: iOS
              sources:
                - path: Sources/OfflineAIVideoStudio
              scheme: {}
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ai.ipadstudio.offlinestudio
                  PRODUCT_NAME: OfflineAIVideoStudio
                  INFOPLIST_FILE: Config/OfflineAIVideoStudio-Info.plist
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  AD_HOC_CODE_SIGNING_ALLOWED: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""

            CoreMLPackageConverter:
              type: application
              platform: iOS
              sources:
                - path: Sources/CoreMLPackageConverter
              scheme: {}
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.ai.ipadstudio.coremlconverter
                  PRODUCT_NAME: CoreMLPackageConverter
                  INFOPLIST_FILE: Config/CoreMLPackageConverter-Info.plist
                  CODE_SIGNING_ALLOWED: NO
                  CODE_SIGNING_REQUIRED: NO
                  CODE_SIGN_IDENTITY: ""
                  AD_HOC_CODE_SIGNING_ALLOWED: NO
                  ASSETCATALOG_COMPILER_APPICON_NAME: ""
          EOF

      - name: Generate Xcode Project via XcodeGen
        shell: bash
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate

      - name: Compile & Package All 3 Targets into .ipa Files
        shell: bash
        run: |
          set +e
          echo "### iPad AI Suite Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Target | Status | Output |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"

          BUILT_COUNT=0
          for TARGET in ProMediaPlayerEnhanced OfflineAIVideoStudio CoreMLPackageConverter; do
            if [ -f "Sources/${TARGET}/ContentView.swift" ]; then
              echo "=========================================="
              echo "Building ${TARGET} for iPadOS (arm64)..."
              echo "=========================================="
              xcodebuild build \
                -project iPadAIMediaSuite.xcodeproj \
                -scheme "${TARGET}" \
                -configuration Release \
                -sdk iphoneos \
                -destination 'generic/platform=iOS' \
                -derivedDataPath "DerivedData_${TARGET}" \
                ARCHS=arm64 \
                ONLY_ACTIVE_ARCH=NO \
                CODE_SIGNING_ALLOWED=NO \
                CODE_SIGNING_REQUIRED=NO \
                CODE_SIGN_IDENTITY="" \
                AD_HOC_CODE_SIGNING_ALLOWED=NO \
                DEVELOPMENT_TEAM="" \
                ASSETCATALOG_COMPILER_APPICON_NAME="" \
                IPHONEOS_DEPLOYMENT_TARGET=17.0                 SWIFT_VERSION=5.0 \
                SWIFT_STRICT_CONCURRENCY=minimal > "build_${TARGET}.log" 2>&1
              RC=$?

              APP_PATH=$(find "DerivedData_${TARGET}" -name "${TARGET}.app" -type d 2>/dev/null | head -n 1)
              if [ $RC -eq 0 ] && [ -n "$APP_PATH" ]; then
                rm -rf Payload
                mkdir -p Payload
                cp -R "$APP_PATH" Payload/
                zip -r -q "build_ipas/${TARGET}.ipa" Payload
                rm -rf Payload
                BUILT_COUNT=$((BUILT_COUNT + 1))
                echo "| **${TARGET}** | ✅ Succeeded | \`${TARGET}.ipa\` |" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "| **${TARGET}** | ❌ Failed (Exit $RC) | See error log below |" >> "$GITHUB_STEP_SUMMARY"
                echo "" >> "$GITHUB_STEP_SUMMARY"
                echo "#### Compiler Errors for ${TARGET}:" >> "$GITHUB_STEP_SUMMARY"
                echo "\`\`\`text" >> "$GITHUB_STEP_SUMMARY"
                grep -E "(error:|fatal error:|warning:.*Sendable)" "build_${TARGET}.log" | head -n 40 >> "$GITHUB_STEP_SUMMARY"
                tail -n 25 "build_${TARGET}.log" >> "$GITHUB_STEP_SUMMARY"
                echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
                cp "build_${TARGET}.log" "build_ipas/build_${TARGET}.log"
              fi
            fi
          done

          ls -lh build_ipas/
          if [ $BUILT_COUNT -eq 0 ]; then
            echo "No IPA files built; check Summary page for exact compiler diagnostics."
            exit 1
          fi

      - name: Upload All Built .ipa Files as Downloadable Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPad-AI-Suite-IPAs
          path: build_ipas/*
          if-no-files-found: warn

      - name: Publish Direct Download Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "iPad AI Studio Suite (.ipa Build #${{ github.run_number }})"
          body: "Direct `.ipa` downloads for SideStore / AltStore / Sideloadly on iPad Air M4:\n- **ProMediaPlayerEnhanced.ipa** (Live 60fps Metal Player + AI Enhancer)\n- **OfflineAIVideoStudio.ipa** (Standalone Batch Offline AI Video Mastering Studio)\n- **CoreMLPackageConverter.ipa** (`.mlpackage` to `.mlmodel` Converter)"
          files: build_ipas/*.ipa
